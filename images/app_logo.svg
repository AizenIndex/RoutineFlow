<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <radialGradient id="subtleGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <!-- Ribbon Gradients -->
    <linearGradient id="ribbonFlow" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="innerLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4F46E5" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Card Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#canvasGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#subtleGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- Designer Flow Ribbon: Mobius Routine Cycle forming an R and checkmark -->
  <g filter="url(#markShadow)">
    <!-- Back Loop Arc -->
    <path
      d="M 170 330
         C 120 280, 120 200, 175 150
         C 230 100, 310 105, 355 155
         C 400 205, 385 285, 330 335
         C 290 370, 235 370, 195 340
         L 165 315"
      fill="none"
      stroke="url(#innerLoop)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.45"
    />

    <!-- Main Ascending Dynamic Flow Ribbon -->
    <path
      d="M 155 270
         C 145 200, 190 140, 260 140
         C 335 140, 380 195, 375 265
         C 370 330, 315 375, 250 375
         C 205 375, 170 350, 150 315"
      fill="none"
      stroke="url(#ribbonFlow)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Sharp Center Geometric Habit Checkmark in Crisp Pure White -->
    <path
      d="M 210 260 L 250 300 L 335 205"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
