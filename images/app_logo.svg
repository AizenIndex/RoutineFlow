<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ring 1: Sunset Orange / Coral (Outer) -->
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#F09819" />
    </linearGradient>

    <!-- Ring 2: Electric Indigo / Violet (Middle) -->
    <linearGradient id="ringMiddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Ring 3: Mint Cyan / Emerald (Inner) -->
    <linearGradient id="ringInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Rim Highlight -->
    <linearGradient id="cardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Squircle Canvas Card -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="url(#cardRim)" stroke-width="2" />

  <!-- Layered Habit Rings (Concentric Progress Rings) -->
  <g filter="url(#ringGlow)" transform="rotate(-90 256 256)">
    <!-- Outer Ring (Habit Streak) -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="26" opacity="0.4" />
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringOuter)" stroke-width="26" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="250" />

    <!-- Middle Ring (Daily Routine) -->
    <circle cx="256" cy="256" r="120" fill="none" stroke="#1E293B" stroke-width="24" opacity="0.4" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="url(#ringMiddle)" stroke-width="24" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="150" />

    <!-- Inner Ring (Consistency Flow) -->
    <circle cx="256" cy="256" r="82" fill="none" stroke="#1E293B" stroke-width="22" opacity="0.4" />
    <circle cx="256" cy="256" r="82" fill="none" stroke="url(#ringInner)" stroke-width="22" stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="90" />
  </g>

  <!-- Crisp Center Geometric Checkmark -->
  <path d="M 226 258 L 246 278 L 290 234" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
